<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬맨틀 힌트 도우미</title>
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --primary: #4dabf7; --accent: #ff6b6b; --text: #495057; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 450px; background: var(--card); padding: 35px 25px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); text-align: center; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 14px; cursor: pointer; font-size: 1rem; font-weight: 600; margin-bottom: 12px; background: #f1f3f5; outline: none; }
        .btn.active { background: var(--primary); color: white; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
        .content { max-height: 0; overflow: hidden; transition: all 0.3s ease; background: #f8f9fa; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .content.show { max-height: 150px; padding: 20px; border: 1px solid #e9ecef; border-top: none; }
        .answer-btn { background: var(--accent); color: white; margin-top: 20px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal { background: white; padding: 30px; border-radius: 20px; width: 80%; max-width: 320px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="title">오늘의 꼬맨틀 힌트 💡</h1>
    <div id="status-msg">꼬맨틀 사이트에서 북마클릿을 실행해주세요.</div>
    
    <div id="main-ui" style="display: none;">
        <div class="hint-section">
            <button class="btn" onclick="toggle(this, 'c1')">힌트 1: 유사도 상위권 <span>▼</span></button>
            <div id="c1" class="content"></div>
        </div>
        <div class="hint-section">
            <button class="btn" onclick="toggle(this, 'c2')">힌트 2: 초성 확인 <span>▼</span></button>
            <div id="c2" class="content"></div>
        </div>
        <button id="ansBtn" class="btn answer-btn" onclick="handleAnswerClick()">최종 정답 확인하기</button>
        <div id="ans-display" class="content" style="font-weight:bold; color:var(--accent); font-size:1.3rem;"></div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <h2 id="mTitle"></h2>
        <p id="mDesc"></p>
        <div id="mBtns" style="display:flex; gap:10px; margin-top:20px;"></div>
    </div>
</div>

<script>
    // 초성 추출 함수
    function getChosung(word) {
        const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
        let result = "";
        for(let i=0; i<word.length; i++) {
            const code = word.charCodeAt(i) - 44032;
            if(code > -1 && code < 11172) result += cho[Math.floor(code/588)];
            else result += word.charAt(i);
        }
        return result;
    }

    // URL 파라미터 읽기
    function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const answer = urlParams.get('ans');
        const topWords = urlParams.get('top');

        if (answer) {
            document.getElementById('status-msg').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
            
            document.getElementById('c1').innerText = `유사도 상위 단어: ${topWords}`;
            document.getElementById('c2').innerHTML = `초성 힌트: <strong>${getChosung(answer)}</strong>`;
            document.getElementById('ans-display').innerText = `정답: ${answer}`;
        }
    }

    function toggle(btn, id) {
        const content = document.getElementById(id);
        const isActive = btn.classList.contains('active');
        document.querySelectorAll('.content').forEach(c => c.classList.remove('show'));
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        if (!isActive) { btn.classList.add('active'); content.classList.add('show'); }
    }

    function handleAnswerClick() {
        const isShown = document.getElementById('ans-display').classList.contains('show');
        if (isShown) showModal("알림", "이미 확인했습니다.", false);
        else showModal("정답 확인", "정답을 보시겠습니까?", true);
    }

    function showModal(title, desc, isConfirm) {
        const overlay = document.getElementById('modalOverlay');
        document.getElementById('mTitle').innerText = title;
        document.getElementById('mDesc').innerText = desc;
        const btnArea = document.getElementById('mBtns');
        btnArea.innerHTML = isConfirm 
            ? `<button class="btn" style="background:var(--accent);color:white;margin:0;flex:1" onclick="confirmAns()">확인</button>
               <button class="btn" style="margin:0;flex:1" onclick="closeModal()">취소</button>`
            : `<button class="btn" style="background:var(--primary);color:white;margin:0;flex:1" onclick="closeModal()">확인</button>`;
        overlay.style.display = 'flex';
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function confirmAns() { closeModal(); toggle(document.getElementById('ansBtn'), 'ans-display'); }

    init();
</script>
</body>
</html>
