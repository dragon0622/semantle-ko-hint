<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬맨틀 힌트 도우미</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --primary: #4dabf7;
            --accent: #ff6b6b;
            --text-main: #212529;
            --text-sub: #495057;
            --gray-light: #f1f3f5;
            --gray-dark: #dee2e6;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 450px; background: var(--card); padding: 40px 25px; border-radius: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.06); text-align: center; }
        h1 { font-size: 1.6rem; margin-bottom: 10px; color: var(--text-main); letter-spacing: -0.5px; }
        .status-text { color: #868e96; font-size: 0.9rem; margin-bottom: 30px; }
        .hint-section { margin-bottom: 12px; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 14px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.2s ease; background: var(--gray-light); color: var(--text-sub); display: flex; justify-content: center; align-items: center; position: relative; outline: none; }
        .btn span { position: absolute; right: 20px; font-size: 0.8rem; transition: transform 0.3s; }
        .btn.active { background: var(--primary); color: white; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
        .btn.active span { transform: rotate(180deg); }
        .content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; background: #f8f9fa; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; font-size: 1.1rem; color: #555; border: 0px solid var(--gray-dark); border-top: none; }
        .content.show { max-height: 200px; padding: 20px; border-width: 1px; }
        .answer-btn { background: var(--accent); color: white; margin-top: 20px; }
        .ans-text { font-weight: 800; color: var(--accent); font-size: 1.4rem; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 340px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h2 { font-size: 1.25rem; margin-bottom: 10px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 24px; }
        .m-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .m-confirm { background: var(--accent); color: white; }
        .m-cancel { background: var(--gray-dark); color: var(--text-sub); }
    </style>
</head>
<body>

<div class="container">
    <h1>오늘의 꼬맨틀 힌트 💡</h1>
    <div id="info-text" style="font-weight: 700; color: var(--primary); margin-bottom: 5px; font-size: 1rem;"></div>
    <div id="status-msg" class="status-text">꼬맨틀 사이트에서 정답을 먼저 배달해주세요.</div>

    <div id="main-ui" style="display: none;">
        <div class="hint-section">
            <button class="btn" data-target="c1">힌트 1: 철학적 힌트 <span>▼</span></button>
            <div id="c1" class="content"></div>
        </div>
        <div class="hint-section">
            <button class="btn" data-target="c2">힌트 2: 언어적 힌트 <span>▼</span></button>
            <div id="c2" class="content"></div>
        </div>
        <div class="hint-section">
            <button class="btn" data-target="c3">힌트 3: 초성 확인 <span>▼</span></button>
            <div id="c3" class="content"></div>
        </div>
        <button id="ansBtn" class="btn answer-btn">최종 정답 확인하기</button>
        <div id="ans-display" class="content ans-text"></div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <h2 id="mTitle"></h2>
        <p id="mDesc" style="color:#868e96; font-size:0.95rem;"></p>
        <div id="mBtns" class="modal-btns"></div>
    </div>
</div>

<script>
    /* [추가] Base64 복호화 함수 (한글 깨짐 방지) */
    function decodeBase64(str) {
        return decodeURIComponent(atob(str).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    }

    function getChosung(word) {
        const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
        let result = "";
        for(let i=0; i<word.length; i++) {
            const code = word.charCodeAt(i) - 44032;
            if(code > -1 && code < 11172) result += cho[Math.floor(code/588)];
            else result += word.charAt(i);
        }
        return result;
    }

    /* [수정] 외부 데이터를 읽어 날짜를 비교하는 init 함수 */
    async function init() {
        const statusMsg = document.getElementById('status-msg');
        const mainUi = document.getElementById('main-ui');
        const infoText = document.getElementById('info-text');

        try {
            // [추가] GitHub의 data.json 데이터 가져오기
            const response = await fetch('data.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error();
            const data = await response.json();

            // [추가] 현재 날짜와 데이터 날짜 비교 로직 (YYYY-MM-DD)
            const now = new Date();
            const todayStr = now.getFullYear() + '-' + 
                             String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                             String(now.getDate()).padStart(2, '0');
            
            // data.updated에서 날짜 부분만 추출
            const dataDate = data.updated.split(' ')[0]; 

            if (todayStr === dataDate) {
                // [추가] 오늘 데이터가 맞으면 정답 복호화 및 UI 노출
                const ans = decodeBase64(data.ans);

                infoText.innerText = `${todayStr} 꼬맨틀`;
                
                statusMsg.style.display = 'none';
                mainUi.style.display = 'block';
                
                // document.getElementById('c1').innerHTML = `이 단어는 총 <b>${ans.length}글자</b>입니다.`;
                // document.getElementById('c3').innerText = `${ans.length}글자 단어입니다. 정답을 유추해보세요!`;
                
                document.getElementById('c1').innerText = data.level1;
                document.getElementById('c2').innerText = data.level2;
                document.getElementById('c3').innerHTML = `초성 힌트: <b>${getChosung(ans)}</b> 정답을 유추해보세요!`;
                document.getElementById('ans-display').innerText = `정답: ${ans}`;
            } else {
                // [추가] 날짜가 다를 경우 안내 문구
                statusMsg.innerText = "오늘의 힌트가 아직 준비되지 않았습니다.";
            }
        } catch (e) {
            statusMsg.innerText = "힌트 데이터를 불러오는 중 오류가 발생했습니다.";
            console.error("상세 오류 정보:", e);
        }
    }

    function toggleAccordion(targetBtn) {
        const targetId = targetBtn.getAttribute('data-target') || 'ans-display';
        const targetContent = document.getElementById(targetId);
        if(!targetContent) return; // 에러 방지

        const isActive = targetBtn.classList.contains('active');
        document.querySelectorAll('.content').forEach(c => c.classList.remove('show'));
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        if (!isActive) {
            targetBtn.classList.add('active');
            targetContent.classList.add('show');
        }
    }

    function showModal(type) {
        const mBtns = document.getElementById('mBtns');
        mBtns.innerHTML = '';
        if (type === 'confirm') {
            document.getElementById('mTitle').innerText = "정답 확인";
            document.getElementById('mDesc').innerText = "정답을 확인하면 다시 되돌릴 수 없습니다.";
            mBtns.append(createBtn("확인", "m-confirm", () => { closeModal(); toggleAccordion(document.getElementById('ansBtn')); }), createBtn("취소", "m-cancel", closeModal));
        } else {
            document.getElementById('mTitle').innerText = "알림";
            document.getElementById('mDesc').innerText = "이미 정답을 확인했습니다.";
            mBtns.appendChild(createBtn("확인", "m-confirm", closeModal));
        }
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function createBtn(t, c, f) {
        const b = document.createElement('button'); b.className = `m-btn ${c}`; b.innerText = t; b.onclick = f; return b;
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

    // [수정] 이벤트 리스너 등록 코드
    document.querySelectorAll('.btn:not(.answer-btn)').forEach(btn => btn.onclick = () => toggleAccordion(btn));
    document.getElementById('ansBtn').onclick = () => {
        document.getElementById('ans-display').classList.contains('show') ? showModal('alert') : showModal('confirm');
    };
    window.onclick = (e) => { if (e.target === document.getElementById('modalOverlay')) closeModal(); };

    // 실행
    init();
</script>
</body>
</html>
